{{- /* One Deployment + Service + ServiceAccount per MCP server. All run the same image; SERVER selects the behaviour. */ -}}
{{- range $name, $s := .Values.servers }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  {{- if $s.gsa }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $s.gsa | quote }}      # Workload Identity: this pod acts as that Google service account
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-{{ $name }}, namespace: {{ $.Release.Namespace }}, labels: {app: mcp-{{ $name }}, app.kubernetes.io/component: mcp-server}}
spec:
  replicas: {{ $.Values.replicas }}
  selector: {matchLabels: {app: mcp-{{ $name }}}}
  template:
    metadata: {labels: {app: mcp-{{ $name }}, app.kubernetes.io/component: mcp-server}}
    spec:
      serviceAccountName: mcp-{{ $name }}
      automountServiceAccountToken: {{ if eq $name "k8s" }}true{{ else }}false{{ end }}   # only the k8s server talks to the Kubernetes API
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: server
        image: {{ required "image is required" $.Values.image }}
        env:
        - {name: SERVER, value: {{ $name }}}
        - {name: NAMESPACE, value: {{ $.Release.Namespace }}}
        - {name: GATEWAY_EMAIL, value: {{ required "gatewayGsa is required" $.Values.gatewayGsa | quote }}}
        - {name: PROJECT_ID, value: {{ $.Values.project | quote }}}
        {{- range $k, $v := $s.env }}
        - {name: {{ $k }}, value: {{ $v | quote }}}
        {{- end }}
        ports: [{containerPort: 8000}]
        readinessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 10, periodSeconds: 15}
        resources: {requests: {cpu: 250m, memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: mcp-{{ $name }}, namespace: {{ $.Release.Namespace }}, labels: {app: mcp-{{ $name }}}}
spec:
  selector: {app: mcp-{{ $name }}}
  ports: [{port: 8000, targetPort: 8000}]
{{- end }}
---
# The k8s server may only READ pods, their logs and events, in this one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mcp-k8s-readonly, namespace: {{ .Release.Namespace }}}
rules:
- {apiGroups: [""], resources: [pods], verbs: [get, list]}
- {apiGroups: [""], resources: [pods/log], verbs: [get]}
- {apiGroups: [""], resources: [events], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mcp-k8s-readonly, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mcp-k8s-readonly}
subjects: [{kind: ServiceAccount, name: mcp-k8s, namespace: {{ .Release.Namespace }}}]
