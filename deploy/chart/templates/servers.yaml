apiVersion: v1
kind: ConfigMap
metadata: {name: server-src, namespace: {{ .Release.Namespace }}}
data:
  server.py: |
{{ .Files.Get "files/server.py" | indent 4 }}
{{- range $n := list "alpha" "beta" }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-{{ $n }}, namespace: {{ $.Release.Namespace }}, labels: {app: mcp-{{ $n }}}}
spec:
  replicas: 1
  selector: {matchLabels: {app: mcp-{{ $n }}}}
  template:
    metadata: {labels: {app: mcp-{{ $n }}}}
    spec:
      containers:
      - name: server
        image: {{ $.Values.serverImage }}
        command: ["sh", "-c", "pip install -q --no-cache-dir mcp==2.3.0 uvicorn && python /src/server.py"]
        env: [{name: SERVER_NAME, value: {{ $n }}}]
        ports: [{containerPort: 8000}]
        volumeMounts: [{name: src, mountPath: /src}]
        resources: {requests: {cpu: 250m, memory: 512Mi}}
        readinessProbe: {tcpSocket: {port: 8000}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 40}
      volumes: [{name: src, configMap: {name: server-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: mcp-{{ $n }}, namespace: {{ $.Release.Namespace }}, labels: {app: mcp-{{ $n }}}}
spec:
  selector: {app: mcp-{{ $n }}}
  ports: [{port: 8000, targetPort: 8000, appProtocol: agentgateway.dev/mcp}]
{{- end }}
