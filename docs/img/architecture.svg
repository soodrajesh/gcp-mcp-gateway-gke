<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900"><defs><marker id="arr-d93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#d93025"/></marker><marker id="arr-3c4043" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#3c4043"/></marker></defs><rect width="1180" height="900" fill="#ffffff"/><text x="34" y="44" font-size="24" font-weight="800" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">MCP gateway on GKE: what is deployed today (spike)</text><text x="34" y="66" font-size="13.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">agentgateway 1.6 · GKE Autopilot · two stateless MCP servers · JWT auth · per-tool RBAC (CEL)</text><rect x="190" y="96" width="970" height="470" rx="10" fill="#f8faff" stroke="#1a73e8" stroke-width="1.6" /><rect x="204" y="85" width="300" height="22" rx="4" fill="#fff"/><text x="214" y="100.5" font-size="12.5" font-weight="700" fill="#1a73e8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Google Cloud project · europe-west1</text><rect x="215" y="130" width="925" height="418" rx="10" fill="none" stroke="#5f6368" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="229" y="119" width="560" height="22" rx="4" fill="#fff"/><text x="239" y="134.5" font-size="12.5" font-weight="700" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">GKE Autopilot cluster  mcp-gw-eu  (Workload Identity, Dataplane V2, Shielded Nodes)</text><rect x="240" y="170" width="440" height="360" rx="10" fill="#faf5fd" stroke="#8e44ad" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="254" y="159" width="250" height="22" rx="4" fill="#fff"/><text x="264" y="174.5" font-size="12.5" font-weight="700" fill="#8e44ad" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">namespace agentgateway-system</text><rect x="720" y="170" width="395" height="360" rx="10" fill="#f4fbfa" stroke="#00897b" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="734" y="159" width="170" height="22" rx="4" fill="#fff"/><text x="744" y="174.5" font-size="12.5" font-weight="700" fill="#00897b" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">namespace spike</text><rect x="62.0" y="393.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="60.0" y="390.0" width="60" height="60" rx="12" fill="#202124"/><circle cx="90" cy="414" r="6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 433 q0 -11 12 -11 q12 0 12 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="465.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">MCP client</text><text x="90" y="478.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">test script via</text><text x="90" y="490.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">kubectl port-forward</text><rect x="312.0" y="223.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="310.0" y="220.0" width="60" height="60" rx="12" fill="#4285F4"/><rect x="330" y="237" width="20" height="26" rx="2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M335 244 h10 M335 250 h10 M335 256 h6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="295.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">agentgateway</text><text x="340" y="309.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">control plane</text><text x="340" y="322.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">reads Gateway, HTTPRoute,</text><text x="340" y="334.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Backend, Policy objects</text><rect x="542.0" y="223.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="540.0" y="220.0" width="60" height="60" rx="12" fill="#D93025"/><path d="M570 237 l11 4 v8 q0 9 -11 14 q-11 -5 -11 -14 v-8 z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M566 251 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="295.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AgentgatewayPolicy</text><text x="570" y="308.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">JWT: issuer, audience,</text><text x="570" y="320.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">expiry, signature</text><text x="570" y="332.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">RBAC: role -&gt; tools (CEL)</text><rect x="312.0" y="393.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="310.0" y="390.0" width="60" height="60" rx="12" fill="#8E44AD"/><circle cx="340" cy="411" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="329" cy="429" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="351" cy="429" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 415 v4 M340 419 h-11 v6 M340 419 h11 v6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="465.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">agentgateway</text><text x="340" y="479.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">proxy</text><text x="340" y="492.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Gateway + HTTPRoute /mcp</text><text x="340" y="504.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">federates both servers</text><rect x="852.0" y="263.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="850.0" y="260.0" width="60" height="60" rx="12" fill="#4285F4"/><path d="M870 282 l9 8 l-9 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M882 299 h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="335.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">mcp-alpha</text><text x="880" y="348.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">read_thing</text><text x="880" y="360.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">write_thing</text><rect x="852.0" y="413.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="850.0" y="410.0" width="60" height="60" rx="12" fill="#4285F4"/><path d="M870 432 l9 8 l-9 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M882 449 h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="485.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">mcp-beta</text><text x="880" y="498.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">read_thing</text><text x="880" y="510.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">write_thing</text><path d="M120.0 420.0 L310.0 420.0" fill="none" stroke="#3c4043" stroke-width="2"  marker-end="url(#arr-3c4043)"/><path d="M370.0 250.0 L540.0 250.0" fill="none" stroke="#3c4043" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-3c4043)"/><path d="M372.0 420.0 L640.0 420.0 L640.0 290.0 L848.0 290.0" fill="none" stroke="#d93025" stroke-width="2"  marker-end="url(#arr-d93025)"/><path d="M640.0 420.0 L640.0 440.0 L848.0 440.0" fill="none" stroke="#d93025" stroke-width="2"  marker-end="url(#arr-d93025)"/><text x="190" y="590" text-anchor="start" font-size="11.5" font-weight="400" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">The control plane programs the proxy (xDS). The policy is checked on every request before it is forwarded.</text><rect x="34" y="612" width="1110" height="100" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.4"/><text x="50" y="635" font-size="13" font-weight="700" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Request flow (verified live by scripts/test.sh)</text><circle cx="60.0" cy="654.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="658.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">1</text><text x="80" y="658" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Client sends an MCP request with a bearer token to the gateway (no token / bad token -&gt; HTTP 401)</text><circle cx="60.0" cy="676.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="680.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">2</text><text x="80" y="680" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Proxy validates the JWT, then evaluates the role claim against the tool the caller asked for</text><circle cx="60.0" cy="698.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="702.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">3</text><text x="80" y="702" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Allowed calls fan out to the right server; tools/list merges both servers; denied tools are hidden</text><text x="34" y="744" text-anchor="start" font-size="12" font-weight="600" fill="#b3261e" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Not built yet (planned): Keycloak as the issuer · MCP protected-resource metadata · Workload Identity per server ·</text><text x="34" y="762" text-anchor="start" font-size="12" font-weight="600" fill="#b3261e" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">k8s-ops / finops / tickets servers · AI agent · NetworkPolicy default-deny · audit log + tracing · private VPC and Cloud NAT.</text><text x="34" y="786" font-size="12" font-weight="700" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Service categories</text><rect x="34" y="795" width="14" height="14" rx="3" fill="#4285F4"/><text x="56" y="806" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Compute / containers</text><rect x="192" y="795" width="14" height="14" rx="3" fill="#8E44AD"/><text x="214" y="806" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Networking</text><rect x="350" y="795" width="14" height="14" rx="3" fill="#00897B"/><text x="372" y="806" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Data</text><rect x="508" y="795" width="14" height="14" rx="3" fill="#F29900"/><text x="530" y="806" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AI / ML</text><rect x="34" y="817" width="14" height="14" rx="3" fill="#D93025"/><text x="56" y="828" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Security</text><rect x="192" y="817" width="14" height="14" rx="3" fill="#1E8E3E"/><text x="214" y="828" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Operations</text><rect x="350" y="817" width="14" height="14" rx="3" fill="#5F6368"/><text x="372" y="828" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Developer tooling</text><circle cx="215.0" cy="420.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="215.0" y="424.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">1</text><text x="215.0" y="402.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">Bearer JWT</text><text x="455.0" y="242.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">reads</text><circle cx="560.0" cy="412.0" r="10.5" fill="#fff" stroke="#d93025" stroke-width="2"/><text x="560.0" y="416.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d93025" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">2</text><text x="560" y="394" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">policy enforced here</text><circle cx="740.0" cy="290.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="740.0" y="294.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">3</text></svg>