rial, sans-serif">agentgateway</text><text x="355" y="389.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">control plane</text><text x="355" y="402.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">fetches Keycloak&#x27;s signing</text><text x="355" y="414.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">keys, programs the proxy</text><rect x="612.0" y="243.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="610.0" y="240.0" width="60" height="60" rx="12" fill="#D93025"/><circle cx="634" cy="270" r="5.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 270 h14 M649 270 v5 M654 270 v4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="315.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Keycloak</text><text x="640" y="328.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">IdP · realm mcp</text><text x="640" y="340.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">issues JWTs</text><rect x="902.0" y="198.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="900.0" y="195.0" width="60" height="60" rx="12" fill="#D93025"/><path d="M930 212 l11 4 v8 q0 9 -11 14 q-11 -5 -11 -14 v-8 z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M926 226 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="930" y="270.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Policies</text><text x="930" y="283.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">JWT: issuer, audience, signature</text><text x="930" y="295.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">role check · per-tool RBAC (CEL)</text><rect x="612.0" y="423.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="610.0" y="420.0" width="60" height="60" rx="12" fill="#8E44AD"/><circle cx="640" cy="441" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="629" cy="459" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="651" cy="459" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 445 v4 M640 449 h-11 v6 M640 449 h11 v6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="495.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">agentgateway</text><text x="640" y="509.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">proxy</text><text x="640" y="522.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Gateway + HTTPRoute</text><text x="640" y="534.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">serves discovery docs, routes /mcp</text><rect x="1092.0" y="293.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="1090.0" y="290.0" width="60" height="60" rx="12" fill="#4285F4"/><path d="M1110 312 l9 8 l-9 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1122 329 h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1120" y="365.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">mcp-alpha</text><text x="1120" y="378.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">read_thing</text><text x="1120" y="390.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">write_thing</text><rect x="1092.0" y="433.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="1090.0" y="430.0" width="60" height="60" rx="12" fill="#4285F4"/><path d="M1110 452 l9 8 l-9 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1122 469 h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1120" y="505.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">mcp-beta</text><text x="1120" y="518.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">read_thing</text><text x="1120" y="530.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">write_thing</text><path d="M120.0 450.0 L610.0 450.0" fill="none" stroke="#3c4043" stroke-width="2"  marker-end="url(#arr-3c4043)"/><path d="M90.0 418.0 L90.0 270.0 L608.0 270.0" fill="none" stroke="#3c4043" stroke-width="2"  marker-end="url(#arr-3c4043)"/><path d="M672.0 450.0 L850.0 450.0 L850.0 320.0 L1088.0 320.0" fill="none" stroke="#d93025" stroke-width="2"  marker-end="url(#arr-d93025)"/><path d="M850.0 450.0 L850.0 460.0 L1088.0 460.0" fill="none" stroke="#d93025" stroke-width="2"  marker-end="url(#arr-d93025)"/><text x="868" y="440" text-anchor="start" font-size="11.5" font-weight="600" fill="#d93025" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">policy checked here</text><rect x="34" y="640" width="1250" height="166" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.4"/><text x="50" y="663" font-size="13" font-weight="700" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Request flow (every step asserted live by scripts/test.sh)</text><circle cx="60.0" cy="682.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="686.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">1</text><text x="80" y="686" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Client calls the gateway with no token: HTTP 401 + WWW-Authenticate: resource_metadata=&lt;url&gt;</text><circle cx="60.0" cy="704.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="708.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">2</text><text x="80" y="708" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Client reads the gateway&#x27;s discovery documents (protected-resource metadata, authorization-server metadata)</text><circle cx="60.0" cy="726.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="730.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">3</text><text x="80" y="730" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Client authenticates at Keycloak (client-credentials) and receives a JWT: issuer, audience = this gateway, role</text><circle cx="60.0" cy="748.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="752.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">4</text><text x="80" y="752" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Client repeats the MCP request with Authorization: Bearer &lt;JWT&gt;</text><circle cx="60.0" cy="770.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="774.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">5</text><text x="80" y="774" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Gateway verifies signature, issuer, audience, expiry; needs a role (403 without); per-tool rule hides tools the role may not use</text><circle cx="60.0" cy="792.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="796.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">6</text><text x="80" y="796" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Allowed calls are routed to the server that owns the tool; tools/list is the merge of both servers</text><text x="34" y="840" text-anchor="start" font-size="12" font-weight="600" fill="#b3261e" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Not built yet (planned): three real servers (k8s-ops, finops, tickets) · gateway-to-server service-to-service auth · Workload Identity per server ·</text><text x="34" y="858" text-anchor="start" font-size="12" font-weight="600" fill="#b3261e" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AI agent · NetworkPolicy default-deny · audit log + tracing · TLS and a private listener · Keycloak on a persistent database · human login (auth code + PKCE).</text><text x="34" y="880" font-size="12" font-weight="700" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Service categories</text><rect x="34" y="889" width="14" height="14" rx="3" fill="#4285F4"/><text x="56" y="900" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Compute / containers</text><rect x="192" y="889" width="14" height="14" rx="3" fill="#8E44AD"/><text x="214" y="900" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Networking</text><rect x="350" y="889" width="14" height="14" rx="3" fill="#00897B"/><text x="372" y="900" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Data</text><rect x="508" y="889" width="14" height="14" rx="3" fill="#F29900"/><text x="530" y="900" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AI / ML</text><rect x="34" y="911" width="14" height="14" rx="3" fill="#D93025"/><text x="56" y="922" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Security</text><rect x="192" y="911" width="14" height="14" rx="3" fill="#1E8E3E"/><text x="214" y="922" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Operations</text><rect x="350" y="911" width="14" height="14" rx="3" fill="#5F6368"/><text x="372" y="922" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Developer tooling</text><text x="365.0" y="440.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">steps 1, 2 and 4: MCP request, discovery, token</text><circle cx="350.0" cy="262.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="350.0" y="266.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">3</text><text x="350" y="244" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">client credentials</text><circle cx="969.0" cy="320.0" r="10.5" fill="#fff" stroke="#d93025" stroke-width="2"/><text x="969.0" y="324.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d93025" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">6</text><circle cx="850.0" cy="385.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="850.0" y="389.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">5</text></svg>